name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm run install:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: |
          npm run test:validation
          npm run test:allowlist
          node --import tsx --test tests/localization.test.ts
      - name: Contract tests
        run: |
          npm run test:contracts
          npm run test:presale:v5
      - name: Build
        run: npm run build
      - name: API integration tests
        run: npm run test:api