name: Deploy Lightdive operator Worker (testnet)

# Deploys workers/lightdive-operator to Cloudflare and copies the operator secrets into it.
# The Worker bundles packages/web3/lightdive.json, so it redeploys whenever that file changes on main.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID,
# plus the existing LIGHTDIVE_OPERATOR_PRIVATE_KEY and LIGHTDIVE_SEED_SECRET (testnet only).

on:
  workflow_dispatch:
  push:
    branches: [main, claude/modest-allen-eexrhu] # TEMP: branch entry removed before merge
    paths:
      - .github/workflows/lightdive-operator-deploy.yml
      - packages/web3/lightdive.json
      - packages/web3/lightdive-abi.json
      - scripts/lightdive-operator-core.mjs
      - workers/lightdive-operator/**

permissions:
  contents: read

concurrency:
  group: lightdive-operator-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm run install:ci
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c workers/lightdive-operator/wrangler.jsonc
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPERATOR_PRIVATE_KEY: ${{ secrets.LIGHTDIVE_OPERATOR_PRIVATE_KEY }}
          LIGHTDIVE_SEED_SECRET: ${{ secrets.LIGHTDIVE_SEED_SECRET }}
        run: |
          printf '%s' "$OPERATOR_PRIVATE_KEY" | npx wrangler secret put OPERATOR_PRIVATE_KEY -c workers/lightdive-operator/wrangler.jsonc
          printf '%s' "$LIGHTDIVE_SEED_SECRET" | npx wrangler secret put LIGHTDIVE_SEED_SECRET -c workers/lightdive-operator/wrangler.jsonc
